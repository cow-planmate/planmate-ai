name: Build & Push (Docker Hub)

# main / test 에 push 되면 이미지를 빌드해 Docker Hub 로 push 한다.
#   main → :latest + deploy 레포 태그 커밋  (운영 k3s — ArgoCD 가 동기화한다)
#   test → :test                              (테스트 서버 planmatetest 전용)
# 테스트 서버(planmatetest)의 Watchtower 가 :test 를 추종한다.
# 운영은 Watchtower 가 아니라 deploy 레포 kustomization.yaml 의 sha 태그가 진실이다
# — 무엇이 돌고 있는지 git 이 알고, git revert 가 곧 롤백이 된다.
# (Backend-v2/Gateway/Community/Notification 의 deploy.yml 을 미러링)

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/cycle123/planmate-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # AI_DB_DSN 은 필수 설정값이라 없으면 import 단계에서 죽는다. DB 필요 테스트는
      # conftest.py 의 db 픽스처가 접속 실패 시 자동 skip 하므로 실제 DB는 필요 없다.
      # `pytest` 단독 실행은 repo root 를 sys.path 에 안 넣는다(pytest.ini 등 config 파일이
      # 없어서). `python -m pytest` 로 실행해야 `import app` 이 풀린다.
      - name: Test
        env:
          AI_DB_DSN: postgresql://test:test@localhost:5432/test
        run: python -m pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 운영(k3s) 반영. main 에서만 돈다 — test 푸시는 planmatetest 로만 나가야 한다.
      # cow-planmate/deploy 의 kustomization.yaml 에서 이 서비스의 newTag 한 줄을 바꾼다.
      # 필요한 것: 레포 Secret DEPLOY_REPO_SSH_KEY (같은 이름의 조직 Secret 은 워크플로에
      # 빈 값으로 전달된다 — Permission denied (publickey) 가 나면 먼저 이걸 본다).
      - name: Bump image tag in deploy repo
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_REPO_SSH_KEY }}
          SERVICE: planmate-ai
        run: |
          set -euo pipefail
          TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:cow-planmate/deploy.git /tmp/deploy
          cd /tmp/deploy

          before=$(grep -c "name: cycle123/${SERVICE}$" kustomization.yaml)
          [ "$before" = "1" ] || { echo "kustomization.yaml 에서 ${SERVICE} 를 정확히 1개 찾지 못했다 (${before}개)"; exit 1; }
          sed -i "\|name: cycle123/${SERVICE}\$|{n;s|newTag: .*|newTag: ${TAG}|}" kustomization.yaml

          if git diff --quiet; then
            echo "태그가 이미 ${TAG} 다 — 커밋할 것이 없다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(${SERVICE}): ${TAG}"
          # 여러 레포가 동시에 머지되면 push 가 부딪힌다. 한 번 rebase 하고 다시 민다.
          git push || { git pull --rebase && git push; }
